name: publish-catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - catalog.json
      - scripts/sign-catalog.mjs

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0

      - name: Sign exact catalog bytes
        env:
          PLUGIN_CATALOG_SIGNING_KEY_ID: ${{ vars.PLUGIN_CATALOG_SIGNING_KEY_ID }}
          PLUGIN_CATALOG_SIGNING_KEY_PEM: ${{ secrets.PLUGIN_CATALOG_SIGNING_KEY_PEM }}
          PLUGIN_CATALOG_SECONDARY_KEY_ID: ${{ vars.PLUGIN_CATALOG_SECONDARY_KEY_ID }}
          PLUGIN_CATALOG_SECONDARY_KEY_PEM: ${{ secrets.PLUGIN_CATALOG_SECONDARY_KEY_PEM }}
        run: node scripts/sign-catalog.mjs catalog.json catalog.sig.json

      - name: Commit signed catalog
        run: |
          set -euo pipefail
          git config user.name rayleabot-catalog-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f catalog.sig.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sign plugin catalog"
          git push
