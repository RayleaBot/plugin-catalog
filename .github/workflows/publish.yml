name: publish-catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yml
      - sources.json
      - scripts/sync_catalog.py
      - tests/**

permissions:
  contents: write

concurrency:
  group: publish-catalog
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Test catalog generator
        run: python -m unittest discover -s tests

      - name: Read latest plugin releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_catalog.py

      - name: Validate generated catalog
        run: python scripts/sync_catalog.py --validate-only

      - name: Publish catalog changes
        run: |
          set -euo pipefail
          git config user.name rayleabot-catalog-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync plugin catalog"
          git push
